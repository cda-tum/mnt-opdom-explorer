[project]
name = "mnt-ode"
description = "Explore Operational Domains of SiDB logic gates"
readme = "README.md"
authors = [
    { name = "Marcel Walter", email = "marcel.walter@tum.de" },
    { name = "Jan Drewniok", email = "jan.drewniok@tum.de" }
]
keywords = ["MNT", "field-coupled nanocomputing", "silicon dangling-bonds", "logic", "physical simulation", "design automation", "operational domain", "GUI", "PyQt", "SiQAD"]
license = { file = "LICENSE.md" }
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "PyQt6==6.8.1",
    "reactivex==4.0.4",
    "pydantic==2.9.0",
    "matplotlib==3.10.1",
    "mnt.pyfiction==0.6.10",
    "pandas==2.2.3",
    "qtawesome==1.4.0",
]
dynamic = ["version"]


[project.urls]
Repository = "https://github.com/cda-tum/mnt-opdom-explorer"
Homepage = "https://www.cda.cit.tum.de/research/nanotech/"
Issues = "https://github.com/cda-tum/mnt-opdom-explorer/issues"
Discussions = "https://github.com/cda-tum/mnt-opdom-explorer/discussions"



[build-system]
requires = [
    "hatchling>=1.27.0",
    "hatch-vcs>=0.4.0"
]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/mnt"]


[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/mnt/ode/_version.py"


[tool.check-sdist]
git-only = [
    "docs/*",
    "test/*",
]


[tool.pytest.ini_options]
minversion = "7.2"
addopts = [
    "-ra", # Show extra test summary info for (s)skipped, (X)failed, (x)passed
    "--strict-markers",
    "--strict-config",
]
xfail_strict = true
log_cli_level = "info"
testpaths = ["test"]
pythonpath = ["src"]
qt_api = "pyqt6"


[tool.coverage]
run.source = ["mnt.ode"]
run.parallel = true
report.exclude_also = [
    '\.\.\.', # Ellipsis
    'if TYPE_CHECKING:',
    'raise AssertionError',
    'raise NotImplementedError',
    '@[a-zA-Z_.]*abstractmethod', # Exclude abstract methods
    'def __repr__', # Often trivial
    'def __str__', # Often trivial
]
# report.fail_under = 80



[tool.mypy]
files = ["src/mnt/ode", "test", "noxfile.py"]
mypy_path = ["$MYPY_CONFIG_FILE_DIR/src"]
warn_unused_configs = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
strict = true
# disallow_untyped_defs = false
explicit_package_bases = true
warn_unreachable = true
plugins = [
  "pydantic.mypy"
]

[[tool.mypy.overrides]]
module = [
    "mnt.pyfiction", # Ignore missing stubs/types for mnt.pyfiction (not typed yet)
]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
namespace-packages = ["mnt"]
preview = true
unsafe-fixes = true

[tool.ruff.lint]
extend-select = [
    "ALL"
]
ignore = [
    "C90", # <...> too complex
    "COM812", # Conflicts with formatter
    "CPY001", # Missing copyright notice at top of file
    "ISC001", # Conflicts with formatter
    "PLR09", # Too many <...>
    "PLR2004", # Magic value used in comparison
    "S101", # Use of assert detected
    "S404", # `subprocess` module is possibly insecure
    "TID252",   # Prefer absolute imports over relative imports from parent modules
    "TD003",  # Missing issue link for this TODO
    "FIX002" # Line contains TODO, consider resolving the issue
]
isort.required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"test/**" = ["T20", "INP001", "SLF001"]
"docs/**" = ["T20", "INP001"]
"noxfile.py" = ["T20", "TID251"]
"*.ipynb" = [
    "D", # pydocstyle
    "E402", # Allow imports to appear anywhere in Jupyter notebooks
    "I002", # Allow missing `from __future__ import annotations` import
]
"src_legacy/**" = ["ALL"]
"test_legacy/**" = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.typos]
default.extend-ignore-re = [
  "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",  # ignore line
  "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on" # ignore block
]
[tool.typos.default.extend-words]
wille = "wille"

[tool.uv]
required-version = ">=0.5.20"
reinstall-package = ["mnt-ode"]

[tool.uv.sources]
mnt-ode = { workspace = true }


[dependency-groups]
build = [
    "hatchling>=1.27.0",
    "hatch-vcs>=0.4.0",
]
test = [
    "nox>=2024.10.9",
    "pytest>=8.3.3",
    "pytest-console-scripts>=1.4.1",
    "pytest-cov>=6",
    "pytest-qt>=4.0.0",
]
dev = [
    { include-group = "build" },
    { include-group = "test" },
]
